spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/menu_db
    username: menu_user
    password: menu_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: menu

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: menu
    create-schemas: true

logging:
  level:
    com.restaurant.menu: DEBUG
